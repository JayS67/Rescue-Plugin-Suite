name: Build and Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer
      - name: Install dependencies
        run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader
      - name: Validate Composer metadata
        run: composer validate --strict
      - name: PHP lint
        run: find . -path './vendor' -prune -o -name '*.php' -print0 | xargs -0 -n 1 php -l
      - name: Build production ZIP
        run: |
          mkdir -p build/rescue-plugin-suite
          rsync -a --delete --exclude='.git' --exclude='.github' --exclude='build' ./ build/rescue-plugin-suite/
          cd build
          zip -r rescue-plugin-suite-${GITHUB_REF_NAME}.zip rescue-plugin-suite
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/rescue-plugin-suite-${{ github.ref_name }}.zip
          generate_release_notes: true
